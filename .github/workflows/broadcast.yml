# Auto-post newly published content (Newsroom Dispatches, Articles) to
# the project's social channels. Cloudflare Pages builds `main` on push
# (~1-2 min) and does not emit a GitHub deployment event we can gate on,
# so this fires on push to main and waits for the CF Pages deploy to go
# live before posting, so post URLs unfurl correctly. (For a hard
# guarantee, wire a CF Pages deploy notification -> repository_dispatch
# and trigger on that instead of the timed wait below.)
#
# Full architecture:
# https://docs.wheelofheaven.world/contributing/dev/social-broadcast/
#
# State lives in data/socials/posted.json. The job commits any changes
# back to main with [skip ci] so this doesn't feedback-loop with itself.

name: Broadcast new content

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (print planned posts, no API calls)"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated channel allowlist (blank = all enabled)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    # Run on push to main and on manual dispatch. The broadcaster is
    # self-gating: it only posts content not already in posted.json, so a
    # push with nothing new is a no-op. The bot's own state commit carries
    # [skip ci], so it never re-triggers this workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      TWITTER_API_KEY:             ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET:          ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN:        ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_USERNAME:            ${{ secrets.TWITTER_USERNAME }}
      BLUESKY_HANDLE:        ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD:  ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_PDS:           ${{ secrets.BLUESKY_PDS }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Need full ref to push back to main; default is shallow.
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # CF Pages builds `main` on push and there is no deployment event to
      # gate on, so give the deploy time to go live before we post — else a
      # brand-new URL could unfurl 404 on social. Skipped on manual dispatch
      # (content is already live by then).
      - name: wait for Cloudflare Pages deploy to go live
        if: github.event_name == 'push'
        run: |
          sleep 120
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://www.wheelofheaven.world/ || true)
            if [ "$code" = "200" ]; then echo "site reachable (HTTP $code)"; break; fi
            echo "waiting for site (HTTP $code)..."; sleep 10
          done

      - name: run broadcaster
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.platforms }}" ]; then
            ARGS="$ARGS --platforms ${{ github.event.inputs.platforms }}"
          fi
          python -m scripts.broadcast $ARGS

      - name: commit state if changed
        # Skip on dry-run dispatch; nothing should have changed.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "wheelofheaven-bot"
          git config user.email "wheelofheaven-bot@users.noreply.github.com"
          if git diff --quiet data/socials/; then
            echo "no state changes to commit"
            exit 0
          fi
          git add data/socials/
          git commit -m "Broadcast: update posted.json [skip ci]"
          # Retry once on non-fast-forward (another deploy may have landed).
          for i in 1 2; do
            if git push origin HEAD:main; then
              echo "pushed state on attempt $i"
              exit 0
            fi
            echo "push failed, rebasing and retrying ($i/2)"
            git pull --rebase origin main
          done
          echo "state push failed after 2 retries" >&2
          exit 1
