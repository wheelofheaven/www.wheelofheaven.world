# mise.toml

min_version = "2025.8.3"

[tools]
zola = "0.21.0"
python = "3.12"
uv = "latest"
node = "22"

[env]
# add env vars here

[tasks.bundle]
description = "Bundle JS files with esbuild"
run = "cd themes/bifrost && npm install --silent && npm run bundle"

[tasks.sources]
description = "Rebuild source manifests and generated source detail pages"
run = "python3 scripts/build_sources.py"

[tasks.relatedness]
description = "Rebuild data/relatedness.json (precomputed geometry for the wiki mini-graph)"
run = "python3 scripts/build_relatedness_layout.py"

[tasks.translations]
description = "Rebuild data/translations.json (canonical-path -> [languages] manifest for hreflang)"
run = "python3 scripts/build_translations_manifest.py"

[tasks.broadcast]
description = "Post newly published content to enabled social channels"
run = "python3 -m scripts.broadcast"

[tasks.broadcast-dry]
description = "Dry-run the social broadcaster (no API calls, no state writes)"
run = "python3 -m scripts.broadcast --dry-run"

[tasks.build]
description = "Compile site statically with Zola"
depends = ["bundle", "sources", "translations", "relatedness"]
run = "zola build"

[tasks.purgecss]
description = "Remove unused CSS from built files"
depends = ["build"]
run = "cd themes/bifrost && npm run purgecss"

[tasks.build-prod]
description = "Production build with CSS purging"
run = "mise run build && mise run purgecss"

[tasks.serve]
description = "Run dev server against the full site — all 10 locales, ~3 min per rebuild"
run = """
port=${ZOLA_PORT:-1111}
while lsof -Pi :$port -sTCP:LISTEN -t >/dev/null 2>&1; do port=$((port + 1)); done
echo "Serving on http://127.0.0.1:$port"
zola serve --port $port --interface 0.0.0.0 --base-url http://127.0.0.1
"""
raw = true

# --- fast theme loop -------------------------------------------------------
# Zola has no incremental path for theme edits: touching anything under
# themes/ logs "Themes changed" and re-renders the whole site, so a one-line
# SCSS tweak costs a full build. The nine translated locales are ~90% of the
# pages and ~92% of the output bytes, so building without them is the lever.
# Measured on this corpus: 189s full, 19s dev, 10s lean.

[tasks.dev-config]
description = "Regenerate config.dev.toml and config.lean.toml from config.toml"
run = "python3 scripts/build_dev_config.py"

[tasks.dev]
description = "Dev server, English only (~19s per rebuild instead of ~189s)"
depends = ["dev-config"]
run = """
port=${ZOLA_PORT:-1111}
while lsof -Pi :$port -sTCP:LISTEN -t >/dev/null 2>&1; do port=$((port + 1)); done
echo "Serving English-only site on http://127.0.0.1:$port"
zola -c config.dev.toml serve --port $port --interface 0.0.0.0 --base-url http://127.0.0.1
"""
raw = true

[tasks.dev-lean]
description = "Dev server, English minus the generated /sources/ records (~10s per rebuild)"
depends = ["dev-config"]
run = """
port=${ZOLA_PORT:-1111}
while lsof -Pi :$port -sTCP:LISTEN -t >/dev/null 2>&1; do port=$((port + 1)); done
echo "Serving lean site on http://127.0.0.1:$port"
zola -c config.lean.toml serve --port $port --interface 0.0.0.0 --base-url http://127.0.0.1
"""
raw = true

[tasks.dev-min]
description = "Dev server, representative slice of the corpus (~8s per rebuild)"
depends = ["dev-config"]
run = """
port=${ZOLA_PORT:-1111}
while lsof -Pi :$port -sTCP:LISTEN -t >/dev/null 2>&1; do port=$((port + 1)); done
echo "Serving minimal slice on http://127.0.0.1:$port"
echo "  wiki + timeline are complete; other sections keep 5 pages each."
zola -c config.min.toml serve --port $port --interface 0.0.0.0 --base-url http://127.0.0.1
"""
raw = true

[tasks.build-dev]
description = "One-off English-only build into public-dev/ — a sanity check without the 3-minute wait"
depends = ["dev-config"]
run = "zola -c config.dev.toml build -o public-dev --force"

[tasks.css]
description = "SCSS-only loop (~1s): static-serves the last dev build and recompiles main.css on save"
depends = ["dev-config"]
run = """
out=${WOH_PREVIEW_DIR:-public-dev}
if [ ! -f "$out/index.html" ]; then
    echo "No preview in $out yet — building it once (~10s)…"
    zola -c config.lean.toml build -o "$out" --force
fi
port=${ZOLA_PORT:-1111}
while lsof -Pi :$port -sTCP:LISTEN -t >/dev/null 2>&1; do port=$((port + 1)); done
echo "Preview on http://127.0.0.1:$port — CSS reloads on save, HTML is frozen at the last build"
python3 -m http.server "$port" -d "$out" >/dev/null 2>&1 &
trap 'kill %1 2>/dev/null' EXIT INT TERM
cd themes/bifrost
npx --yes sass@1 --watch --no-source-map --quiet --quiet-deps --load-path=sass \
    sass/main.scss "$OLDPWD/$out/main.css"
"""
raw = true

[tasks.check]
description = "Rebuild source artifacts and run diagnostics"
depends = ["sources"]
run = "python3 scripts/validate_source_references.py && zola check"

[tasks.clean]
description = "Wipe public directory"
run = "rm -rf public || true"
