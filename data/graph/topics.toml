# The topic vocabulary of Wheel of Heaven — the backbone of the knowledge graph on /graph/.
#
# One entry per topic slug. scripts/build_graph.py reads this file, files every page
# (wiki, articles, timeline, news, library, datasets) and every cited source under the
# topics whose `match` terms it carries, and draws `broader` as topic-to-topic edges,
# so the vocabulary is itself a graph, not a list.
#
#   name         how the topic is shown
#   kind         theme      — an idea or motif that runs across traditions
#                tradition  — a body of texts and the people who carry it
#                figure     — a person or being the corpus keeps returning to
#                method     — a way of reading: philology, comparison, data
#                science    — a field of present-day science the corpus reads with
#                future     — what the framework says comes next
#   description  one sentence: what the topic gathers here
#   broader      parent topics (edges on the graph)
#   page         optional wiki slug that defines the topic; the node opens it
#   match        lower-case phrases matched (whole words) against a page's title,
#                alternative names, keywords, category, description and summary,
#                and against a source's topic list
#
# Adding a topic: add the entry, then run `mise run graph`. The build prints topics that
# match nothing and pages that match no topic, so gaps are visible.

# ---- The framework -------------------------------------------------------------

[elohim-hypothesis]
name = "Elohim hypothesis"
kind = "theme"
description = "The working hypothesis at the centre of the corpus: the Elohim, an advanced human civilization, designed life on Earth and left a record in the religious texts."
