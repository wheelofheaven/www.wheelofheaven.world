[_index]
title = "נושאים"
description = "הנושאים שהקורפוס חוזר אליהם שוב ושוב — תמות, מסורות, דמויות, שיטות ומדעים — וכל אחד מהם מקבץ את הערכים, המאמרים, העידנים והספרים המתויקים תחתיו."

[elohim-hypothesis]
name = "השערת האלוהים"
description = "השערת העבודה שבמרכז הקורפוס: האלוהים, ציוויליזציה אנושית מתקדמת, תכננו את החיים על פני כדור הארץ והשאירו את עדותם בטקסטים הדתיים."

[creation]
name = "בריאה"
description = "עשיית העולם והחיים, הנקראת כהנדסה במעבדות ולא כבריאה יש מאין."

[human-origins]
name = "מוצא האדם"
description = "מאין באה האנושות: אדם וחוה, האדמיים, הגן והחברות האנושיות הראשונות."

[divine-council]
name = "המועצה האלוהית"
description = "אספת האלים — מועצת הנצחיים בקאנון, בני האלוהים ובית הדין השמימי ברחבי המזרח הקדום."

[rebellion]
name = "המרד"
description = "הפלג שפרש מן השורות — הנחש, לוציפר והשטן, האופוזיציה שהקאנון מתאר בתוך הציוויליזציה של היוצרים עצמם."

[watchers-and-giants]
name = "השומרים והענקים"
description = "השומרים שירדו, הנפילים שנולדו מהם, והענקים של בראשית ו ושל ספר חנוך הראשון."

[theomachy]
name = "מלחמת האלים"
description = "קרבות בשמיים — התאומכיה, מלחמת האלוהים ומיתוסי הקרב הזוכרים סכסוך בין היוצרים."

[chaos-and-dragons]
name = "תוהו ותנינים"
description = "לוויתן, התנין, תיאמת והתנינים של בראשית א, כא — מפלצת התוהו ומה שהקאנון עושה בה."

[flood]
name = "המבול"
description = "המבול כאתחול מכוון, וסיפורי המבול מאתרחסיס וגלגמש ועד בראשית ומעבר לו."

[babel]
name = "בבל והלשונות"
description = "המגדל, הפיזור ובלבול הלשונות, הנקראים כצעד שנקטו היוצרים."

[covenant-and-law]
name = "ברית ותורה"
description = "הבריתות עם נח, אברהם ומשה, התורה בסיני והארון שנשא אותה."

[prophets-and-messengers]
name = "נביאים ושליחים"
description = "שושלת השליחים שהקאנון מונה — משה, אליהו, יחזקאל, ישוע, מוחמד, הבודהה, ראל — שנשלחו אחד בכל עידן."

[embassy-and-temple]
name = "שגרירות ומקדש"
description = "מקום המפגש: המשכן והמקדשים של קדם, והשגרירות שהקאנון מבקש מן האנושות לבנות."

[apocalypse-and-return]
name = "אפוקליפסה ושיבה"
description = "עידן ההתגלות: החשיפה, גילוי מעשי היוצרים והשיבה שהקאנון צופה."

[immortality]
name = "אלמוות ותחיית המתים"
description = "עץ החיים, אריכות ימים, כוכב הלכת של הנצחיים ותחייה באמצעות המדע."

[symbols]
name = "סמלים ומוטיבים"
description = "הסימנים הנושאים את המסגרת — הסמל הראליאני של האינסוף, מגן דוד, צלב הקרס, המנורה, העץ והגלגל."

[cosmic-cycles]
name = "מחזורים קוסמיים"
description = "נקיפת השוויונים, השנה הגדולה ושנים־עשר עידני העולם שדרכם הקורפוס מספר את תולדותיו."

[infinity-and-cosmology]
name = "אינסוף וקוסמולוגיה"
description = "יקום אינסופי בשני הכיוונים, קוסמולוגיה פרקטלית וחיים ללא התחלה וללא סוף."

[plurality-of-worlds]
name = "ריבוי העולמות"
description = "כוכבי לכת מיושבים אחרים: פלורליזם קוסמי, התחרות בין ציוויליזציות וכוכב הלכת של האלוהים."

[contact-and-ufos]
name = "מגע ועב״מים"
description = "מפגשים קרובים בהיסטוריה ובימינו, תיקי התופעות האוויריות הבלתי מזוהות והמוסדות החוקרים או המסתירים אותן."

[ancient-sites]
name = "אתרים עתיקים"
description = "מגליתים, פירמידות ונופים מקודשים — התיעוד הבנוי של העולם העתיק והאופן שבו הקורפוס קורא אותו."

[sodom-and-destruction]
name = "חורבנות"
description = "סדום ועמורה ושאר ההשמדות שהטקסטים מתארים כאש מן השמיים."

[monotheism]
name = "מונותאיזם והאלים"
description = "כיצד יוצרים רבים הפכו לאל אחד: מונותאיזם, עבודת אלילים והאלוהים בלשון רבים של המקרא העברי."

[raelism]
name = "ראליזם"
description = "הקאנון הראליאני משנת 1973 ואילך — המסרים והתנועה הנושאת אותם, המרכז הפרשני של הקורפוס."

[hebrew-bible]
name = "המקרא העברי"
description = "התנ״ך — תורה, נביאים וכתובים — בעברית, ביוונית ובתרגומיו של הקורפוס עצמו."

[second-temple-judaism]
name = "יהדות בית שני"
description = "חנוך, היובלים, מגילות ים המלח והספרים החיצוניים שנכתבו בין ספרי המקרא האחרונים לבין חז״ל."

[jewish-mysticism]
name = "מיסטיקה יהודית"
description = "הקבלה, ספרות ההיכלות ושיעור קומה — הקריאה המיסטית של הדמות האלוהית ושל ההיכלות השמימיים."

[christianity]
name = "נצרות"
description = "הברית החדשה והמסורת הנוצרית, הנקראות דרך תיאור הקאנון את ישוע כשליח."

[gnosticism-and-hermeticism]
name = "גנוסטיקה והרמטיקה"
description = "כתבי הגנוסטיקה, הקורפוס ההרמטי והקו האזוטרי המערבי העובר דרכם."

[islam]
name = "אסלאם"
description = "הקוראן, התקופה האסלאמית המוקדמת ושאלות הקיבלה הראשונה."

[mesopotamia]
name = "מסופוטמיה"
description = "שומר, אכד ובבל — האנונאקי, אתרחסיס, גלגמש, אנומה אליש ורשימת המלכים."

[egypt]
name = "מצרים העתיקה"
description = "טקסטים ומונומנטים מצריים — הפירמידות, הספינקס, ספר המתים והאלים שבאו בסירה."

[greece]
name = "המסורת היוונית"
description = "הומרוס, הסיודוס והמיתוסים היווניים על האלים, הענקים והמלחמות בשמיים."

[levant-and-anatolia]
name = "הלבנט ואנטוליה"
description = "אוגרית וכנען, החתים והחורים — שכני ישראל שאלוהיהם חולקים שמות עם אלוהי ישראל."

[india-and-persia]
name = "הודו ופרס"
description = "הוודות והאווסטה הזורואסטרית — כתבי הקודש המזרחיים של הבריאה, המחזורים והמלחמה הקוסמית."

[new-religions]
name = "תנועות דתיות חדשות"
description = "קדושי אחרית הימים, הבהאים, הקאו־דאי, אומוטו וטנריקיו — התגלויות מודרניות שהקורפוס קורא לצד ההתגלות שלו."

[folklore]
name = "מיתוס ופולקלור"
description = "מעשיות, טיפוסי סיפור ומיתולוגיות העולם, ממופתחים מוטיב אחר מוטיב."

[ancient-astronaut-literature]
name = "ספרות האסטרונאוטים הקדמונים"
description = "הכותבים המודרניים הקוראים טקסטים עתיקים כדיווחי מגע — סנדי, פון דניקן, סיטשין, Biglino, וואליס, הנקוק."

[yahweh]
name = "יהוה"
description = "נשיא מועצת הנצחיים בקאנון, אלוהי ישראל במקרא העברי."

[lucifer-and-satan]
name = "לוציפר והשטן"
description = "שתי דמויות שונות שהמסורת מיזגה: מביא האור שלימד את האנושות, והיריב שהתנגד לה."

[noah]
name = "נח"
description = "השורד מן המבול ושומר התיבה — ומקביליו אותנפישתים, זיוסודרה ואתרחסיס."

[abraham-and-moses]
name = "אברהם ומשה"
description = "אבי הברית ונותן התורה של יציאת מצרים."

[enoch-and-elijah]
name = "חנוך ואליהו"
description = "השניים שהמקרא אומר כי נלקחו בחייהם — סופר השומרים ונביא רכב האש."

[jesus]
name = "ישוע"
description = "שליח עידן הדגים בקאנון, ומרכז המסורת הנוצרית."

[rael]
name = "ראל"
description = "קלוד וורילון, מקבל המסרים של 1973 והאחרון בנביאים בשושלת הקאנון."

[philology]
name = "פילולוגיה ותרגום"
description = "קריאת הטקסטים בלשונותיהם — עברית, יוונית, אכדית — ומה שהתרגום מסתיר או משיב."

[comparative-method]
name = "השיטה ההשוואתית"
description = "הצבת מסורות זו לצד זו בלי לשטח אותן — מיתולוגיה השוואתית ודתות משוות."

[hermeneutics]
name = "הרמנויטיקה"
description = "כיצד הקורפוס קורא: נאו־אוהמריזם, ארבע הרמות, שיטת Biglino ותנאי הקוהרנטיות של סנדי."

[open-data]
name = "נתונים פתוחים"
description = "הקורפוס כנתונים — מאגרי נתונים ב־CC0, מפתחות וגרפים המאפשרים לכל אחד לבדוק את העבודה."

[genetic-engineering]
name = "הנדסה גנטית"
description = "ביולוגיה סינתטית, גנומים סינתטיים וחיים מהונדסים — מדע ההווה המדביק את תיאור הבריאה שבקאנון."

[astrobiology]
name = "אסטרוביולוגיה"
description = "חיים מעבר לכדור הארץ: פנספרמיה, משוואת דרייק והחיפוש אחר ביוספרות אחרות."

[intelligent-design]
name = "תכנון תבוני"
description = "תכנון בטבע — הגרסה של הקאנון, הנבדלת מן התנועה הבריאתנית ששאלה את השם."

[earth-sciences]
name = "כדור הארץ ותולדותיו"
description = "גאולוגיה, פלאונטולוגיה וההיסטוריה העמוקה של כוכב הלכת — פנגיאה, הדינוזאורים וכדור הארץ החי."

[astronomy]
name = "אסטרונומיה"
description = "השמיים שהקדמונים צפו בהם — נקיפה, קבוצות כוכבים, השמש, נוגה והארכיאואסטרונומיה של המונומנטים שלהם."

[psychology-and-religion]
name = "נפש ודת"
description = "הלא־מודע הקולקטיבי של יונג, הדת כתופעה אנושית, ומדוע מיתוסים חוזרים."

[future-society]
name = "חברת העתיד"
description = "גניוקרטיה, הומניטריזם ופרדיזם — החברה שהקאנון מציע כאשר המדע ישחרר את האנושות מן העבודה."

[space-future]
name = "אל החלל"
description = "תורה של האנושות עצמה להיות יוצרת: מסעות בחלל, טרהפורמינג וזריעת חיים בעולמות אחרים."
