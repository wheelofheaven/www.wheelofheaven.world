[_index]
title = "Темы"
description = "Предметы, к которым корпус возвращается снова и снова, — сквозные темы, традиции, фигуры, методы и науки; каждый собирает отнесённые к нему статьи энциклопедии, статьи, эпохи и книги."

[elohim-hypothesis]
name = "Гипотеза Элохим"
description = "Рабочая гипотеза в центре корпуса: Элохим, развитая человеческая цивилизация, создали жизнь на Земле и оставили свидетельство об этом в религиозных текстах."

[creation]
name = "Сотворение"
description = "Создание мира и жизни, прочитанное как инженерная работа в лабораториях, а не как творение из ничего."

[human-origins]
name = "Происхождение человека"
description = "Откуда пришло человечество: Адам и Ева, адамиты, Сад и первые человеческие общества."

[divine-council]
name = "Божественный совет"
description = "Собрание богов — Совет Вечных в каноне, сыны Божьи и небесный двор по всему древнему Ближнему Востоку."

[rebellion]
name = "Восстание"
description = "Фракция, нарушившая строй, — змей, Люцифер и Сатана, оппозиция, которую канон описывает внутри самой цивилизации создателей."

[watchers-and-giants]
name = "Стражи и исполины"
description = "Сошедшие Стражи, рождённые от них Нефилим и исполины Бытия 6 и Первой книги Еноха."

[theomachy]
name = "Война богов"
description = "Битвы на небесах — Теомахия, война Элохим и мифы о сражениях, хранящие память о конфликте среди создателей."

[chaos-and-dragons]
name = "Хаос и драконы"
description = "Левиафан, таннин, Тиамат и драконы Бытия 1:21 — чудовище хаоса и то, как его понимает канон."

[flood]
name = "Потоп"
description = "Потоп как намеренная перезагрузка и сказания о потопе — от Атрахасиса и Гильгамеша до Бытия и далее."

[babel]
name = "Вавилон и языки"
description = "Башня, рассеяние и смешение языков, прочитанные как мера, принятая создателями."

[covenant-and-law]
name = "Завет и Закон"
description = "Заветы с Ноем, Авраамом и Моисеем, Закон на Синае и ковчег, в котором его несли."

[prophets-and-messengers]
name = "Пророки и посланники"
description = "Череда посланников, которых называет канон, — Моисей, Илия, Иезекииль, Иисус, Мухаммад, Будда, Раэль, — посланных по одному на каждую эпоху."

[embassy-and-temple]
name = "Посольство и храм"
description = "Место встречи: скиния и храмы древности, а также посольство, которое канон просит построить человечество."

[apocalypse-and-return]
name = "Апокалипсис и возвращение"
description = "Эпоха откровения: раскрытие, обнародование труда создателей и возвращение, которого ожидает канон."

[immortality]
name = "Бессмертие и воскрешение"
description = "Древо жизни, долголетие, Планета Вечных и воскрешение посредством науки."

[symbols]
name = "Символы и мотивы"
description = "Знаки, несущие эту картину мира, — раэлианский символ бесконечности, звезда Давида, свастика, менора, древо и колесо."

[cosmic-cycles]
name = "Космические циклы"
description = "Прецессия равноденствий, Великий Год и двенадцать мировых эпох, через которые корпус рассказывает свою историю."

[infinity-and-cosmology]
name = "Бесконечность и космология"
description = "Вселенная, бесконечная в обе стороны, фрактальная космология и жизнь без начала и конца."

[plurality-of-worlds]
name = "Множественность миров"
description = "Другие обитаемые планеты: космический плюрализм, соперничество цивилизаций и родная планета Элохим."

[contact-and-ufos]
name = "Контакт и НЛО"
description = "Близкие контакты в истории и сегодня, досье НАЯ и институты, которые их изучают или скрывают."

[ancient-sites]
name = "Древние памятники"
description = "Мегалиты, пирамиды и сакральные ландшафты — рукотворное свидетельство древнего мира и то, как его читает корпус."

[sodom-and-destruction]
name = "Разрушения"
description = "Содом и Гоморра и другие истребления, которые тексты описывают как огонь с неба."

[monotheism]
name = "Монотеизм и боги"
description = "Как множество создателей стало единым Богом: монотеизм, идолопоклонство и множественные Элохим Еврейской Библии."

[raelism]
name = "Раэлизм"
description = "Раэлианский канон с 1973 года — Послания и движение, которое их несёт, интерпретационный центр корпуса."

[hebrew-bible]
name = "Еврейская Библия"
description = "Танах — Тора, Пророки и Писания — на иврите, на греческом и в собственных переводах корпуса."

[second-temple-judaism]
name = "Иудаизм Второго Храма"
description = "Енох, Книга Юбилеев, свитки Мёртвого моря и апокрифы, написанные между последними книгами Библии и раввинами."

[jewish-mysticism]
name = "Еврейская мистика"
description = "Каббала, литература Хейхалот и Шиур Кома — мистическое прочтение божественного облика и небесных чертогов."

[christianity]
name = "Христианство"
description = "Новый Завет и христианская традиция, прочитанные через рассказ канона об Иисусе как посланнике."

[gnosticism-and-hermeticism]
name = "Гностицизм и герметизм"
description = "Гностические писания, Corpus Hermeticum и западная эзотерическая линия, проходящая через них."

[islam]
name = "Ислам"
description = "Коран, ранний исламский период и вопросы первой киблы."

[mesopotamia]
name = "Месопотамия"
description = "Шумер, Аккад и Вавилон — Ануннаки, Атрахасис, Гильгамеш, Энума элиш и Царский список."

[egypt]
name = "Древний Египет"
description = "Египетские тексты и памятники — пирамиды, Сфинкс, Книга мёртвых и боги, прибывшие на ладье."

[greece]
name = "Греческая традиция"
description = "Гомер, Гесиод и греческие мифы о богах, гигантах и войнах на небесах."

[levant-and-anatolia]
name = "Левант и Анатолия"
description = "Угарит и Ханаан, хетты и хурриты — соседи Израиля, чьи боги носят те же имена."

[india-and-persia]
name = "Индия и Персия"
description = "Веды и зороастрийская Авеста — восточные писания о сотворении, циклах и космической войне."

[new-religions]
name = "Новые религиозные движения"
description = "Святые последних дней, бахаи, каодаизм, Оомото и Тэнрикё — современные откровения, которые корпус читает рядом со своим."

[folklore]
name = "Миф и фольклор"
description = "Волшебные сказки, сказочные типы и мифологии мира, проиндексированные мотив за мотивом."

[ancient-astronaut-literature]
name = "Литература о древних астронавтах"
description = "Современные авторы, читающие древние тексты как отчёты о контакте, — Сенди, фон Дэникен, Ситчин, Biglino, Уоллис, Хэнкок."

[yahweh]
name = "Яхве"
description = "Председатель Совета Вечных в каноне, Бог Израиля в Еврейской Библии."

[lucifer-and-satan]
name = "Люцифер и Сатана"
description = "Две разные фигуры, слитые традицией в одну: светоносец, учивший человечество, и противник, восставший против него."

[noah]
name = "Ной"
description = "Переживший Потоп хранитель ковчега — и его двойники Утнапиштим, Зиусудра и Атрахасис."

[abraham-and-moses]
name = "Авраам и Моисей"
description = "Патриарх завета и законодатель Исхода."

[enoch-and-elijah]
name = "Енох и Илия"
description = "Двое, о которых Библия говорит, что они были взяты живыми, — писец Стражей и пророк огненной колесницы."

[jesus]
name = "Иисус"
description = "Посланник Эпохи Рыб в каноне и центр христианской традиции."

[rael]
name = "Раэль"
description = "Клод Ворилон, получатель Посланий 1973 года и последний из пророков в линии канона."

[philology]
name = "Филология и перевод"
description = "Чтение текстов на их собственных языках — иврите, греческом, аккадском — и то, что перевод скрывает или восстанавливает."

[comparative-method]
name = "Сравнительный метод"
description = "Сопоставление традиций без их уравнивания — сравнительная мифология и сравнительное религиоведение."

[hermeneutics]
name = "Герменевтика"
description = "Как читает корпус: неоэвгемеризм, четыре уровня, метод Biglino и условия связности Сенди."

[open-data]
name = "Открытые данные"
description = "Корпус как данные — наборы данных CC0, указатели и графы, позволяющие любому проверить работу."

[genetic-engineering]
name = "Генетическая инженерия"
description = "Синтетическая биология, синтетические геномы и сконструированная жизнь — современная наука догоняет рассказ канона о сотворении."

[astrobiology]
name = "Астробиология"
description = "Жизнь за пределами Земли: панспермия, уравнение Дрейка и поиск других биосфер."

[intelligent-design]
name = "Разумный замысел"
description = "Замысел в природе — версия канона, отличная от креационистского движения, позаимствовавшего это название."

[earth-sciences]
name = "Земля и её история"
description = "Геология, палеонтология и глубокая история планеты — Пангея, динозавры и живая Земля."

[astronomy]
name = "Астрономия"
description = "Небо, за которым наблюдали древние, — прецессия, созвездия, Солнце, Венера и археоастрономия их памятников."

[psychology-and-religion]
name = "Психика и религия"
description = "Коллективное бессознательное Юнга, религия как человеческое явление и причины повторяемости мифов."

[future-society]
name = "Общество будущего"
description = "Гениократия, гуманитаризм и парадизм — общество, которое предлагает канон, когда наука освободит человечество от труда."

[space-future]
name = "В космос"
description = "Очередь самого человечества стать создателем: космические полёты, терраформирование и засев жизни в других мирах."
